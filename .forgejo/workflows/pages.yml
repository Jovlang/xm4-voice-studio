# Build the site and publish it to Codeberg Pages (git-pages) at
# https://<owner>.codeberg.page/xm4-voice-studio/ on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-small
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_BASE: /xm4-voice-studio/
          # Pack sharing (Supabase Storage). The publishable key is meant to be public.
          PUBLIC_SUPABASE_URL: https://cfipbavbxamdildppmnt.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mXIXAbFaH4Oc1MQ2kRz2yQ_1Bm7FJCh
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/xm4-voice-studio/
          token: ${{ forge.token }}
          source: dist/
